name: Linux verification (free public runner)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Standard runners are free for public repos; do not run if visibility changes.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ""
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python without an Actions cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies and record versions
        run: |
          git rev-parse HEAD
          python --version
          python -m pip install -r requirements.txt
          python -m pip freeze
          docker version

      - name: Run the unchanged pytest suite
        id: pytest
        run: python -m pytest -q -ra

      - name: Build and check the contest container
        # Collect Docker evidence even if pytest fails, but retain the failed job.
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        run: python scripts/ci_docker_smoke.py

      # Deliberately no artifact upload, cache action, registry push, or API key.
